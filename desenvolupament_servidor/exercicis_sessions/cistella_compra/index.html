<!DOCTYPE html>
<html lang="ca">

    <meta charset="UTF-8">
    <title>Botiga - Cistella de la compra</title>

<body>
    <h1>Botiga d'Informatica</h1>
    <p>Selecciona la quantitat i afegeix els productes a la cistella.</p>

    <hr>

    <h2>Teclat</h2>
    <p>Preu: 30 EUR</p>
    <form action="cistella_compra.php" method="POST">
        <input type="hidden" name="producte" value="teclat">
        <label for="quantitat_teclat">Quantitat:</label>
        <input type="number" id="quantitat_teclat" name="quantitat" min="1" value="1" required>
        <button type="submit">Afegir a la cistella</button>
    </form>

    <hr>

    <h2>Ratoli</h2>

        <label for="quantitat_ratoli">Quantitat:</label>
        <input type="number" id="quantitat_ratoli" name="quantitat" min="1" value="1" required>
        <button type="submit">Afegir a la cistella</button>
    </form>

    <hr>

    <p><a href="resum.php">Finalitzar compra</a></p>
